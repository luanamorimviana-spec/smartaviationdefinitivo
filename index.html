    <script>
    (() => {
        "use strict";

        // ---------- Firebase ----------
        let db, auth, storage;
        try {
            db = firebase.firestore();
            auth = firebase.auth();
            storage = firebase.storage();
        } catch (e) {
            console.error("Firebase init falhou:", e);
            alert("Firebase não inicializou. Confira o console.");
            return;
        }

        const byId = (id) => document.getElementById(id);
        const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

        // ---------- Upload de Imagem ----------
        async function uploadImage(file, folder) {
            console.log(`Iniciando upload para a pasta: ${folder}`);
            const storageRef = storage.ref();
            const fileRef = storageRef.child(`${folder}/${Date.now()}_${file.name}`);
            
            // Timeout de 30 segundos para não travar
            const timeout = new Promise((_, reject) => 
                setTimeout(() => reject(new Error("Timeout: O upload demorou mais de 30s. Verifique sua internet ou as regras do Storage.")), 30000)
            );

            try {
                const uploadTask = fileRef.put(file);
                await Promise.race([uploadTask, timeout]);
                console.log("Upload concluído. Obtendo URL...");
                const url = await fileRef.getDownloadURL();
                console.log("URL obtida:", url);
                return url;
            } catch (error) {
                console.error("Erro no upload:", error);
                throw error;
            }
        }

        // ---------- Login ----------
        window.openAdminLogin = () => {
            byId("adminLoginModal").classList.remove("hidden");
            byId("adminLoginFeedback").textContent = "";
            setTimeout(() => byId("adminEmail")?.focus(), 50);
        };
        window.closeAdminLogin = () => byId("adminLoginModal").classList.add("hidden");

        byId("adminAccessBtn").addEventListener("click", () => {
            if (auth.currentUser) {
                openAdminDashboard(auth.currentUser);
            } else {
                openAdminLogin();
            }
        });

        byId("adminLoginModal").addEventListener("click", (e) => {
            if (e.target === byId("adminLoginModal")) closeAdminLogin();
        });

        byId("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = byId("adminLoginButton");
            const fb = byId("adminLoginFeedback");
            btn.disabled = true; btn.textContent = "Entrando..."; fb.textContent = "";
            try {
                await auth.signInWithEmailAndPassword(
                    byId("adminEmail").value.trim(),
                    byId("adminPassword").value
                );
            } catch (err) {
                console.error("Erro no login:", err);
                const msgs = {
                    "auth/invalid-credential": "E-mail ou senha incorretos.",
                    "auth/user-not-found": "Conta não encontrada.",
                    "auth/wrong-password": "E-mail ou senha incorretos.",
                    "auth/too-many-requests": "Muitas tentativas. Aguarde.",
                    "auth/invalid-email": "E-mail inválido.",
                    "auth/network-request-failed": "Falha de conexão.",
                    "auth/operation-not-allowed": "Login por e-mail/senha não está ativado no Firebase Console."
                };
                fb.textContent = msgs[err.code] || "Erro ao entrar: " + err.message;
            } finally {
                btn.disabled = false; btn.textContent = "Entrar";
            }
        });

        window.adminLogout = async () => {
            await auth.signOut();
            closeAdminDashboard();
            openAdminLogin();
        };

        // ---------- Dashboard ----------
        window.openAdminDashboard = async (user) => {
            closeAdminLogin();
            byId("adminDashboard").classList.remove("hidden");
            byId("adminSignedInAs").textContent = user.email || user.uid;
            switchTab("hero");
        };
        window.closeAdminDashboard = () => byId("adminDashboard").classList.add("hidden");

        function switchTab(name) {
            document.querySelectorAll(".admin-tab").forEach(b => {
                const active = b.dataset.tab === name;
                b.classList.toggle("bg-aero-primary", active);
                b.classList.toggle("text-white", active);
                b.classList.toggle("text-slate-700", !active);
                b.classList.toggle("hover:bg-slate-100", !active);
            });
            document.querySelectorAll(".admin-section").forEach(s => {
                s.classList.toggle("hidden", s.dataset.section !== name);
            });
            if (name === "products") loadAdminProducts();
            if (name === "inquiries") loadInquiries();
        }
        document.querySelectorAll(".admin-tab").forEach(b => {
            b.addEventListener("click", () => switchTab(b.dataset.tab));
        });

        // ---------- Auth state ----------
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                closeAdminDashboard();
                return;
            }
            try {
                const doc = await db.collection("admins").doc(user.uid).get();
                if (!doc.exists || doc.data().active !== true) {
                    await auth.signOut();
                    openAdminLogin();
                    byId("adminLoginFeedback").textContent = "Esta conta não tem permissão administrativa. Crie o documento admins/UID no Firestore.";
                    return;
                }
                openAdminDashboard(user);
            } catch (err) {
                console.error("Erro ao validar admin:", err);
                byId("adminLoginFeedback").textContent = "Erro ao validar admin. Verifique as regras do Firestore.";
            }
        });

        // ---------- TEMPO REAL ----------
        function listenContent(docId, callback) {
            db.collection("siteContent").doc(docId).onSnapshot((doc) => {
                callback(doc.exists ? doc.data() : {});
            }, (error) => {
                console.error(`Erro ao ouvir ${docId}:`, error);
            });
        }

        listenContent("hero", (d) => {
            if (d.badge) byId("heroBadge").textContent = d.badge;
            if (d.title) byId("heroTitle").textContent = d.title;
            if (d.subtitle) byId("heroSubtitle").textContent = d.subtitle;
            if (d.imageUrl) byId("heroBackground").style.backgroundImage = `url('${d.imageUrl}')`;
            
            byId("heroBadgeInput").value = d.badge || byId("heroBadge").textContent;
            byId("heroTitleInput").value = d.title || byId("heroTitle").textContent;
            byId("heroSubtitleInput").value = d.subtitle || byId("heroSubtitle").textContent;
            if (d.imageUrl) {
                byId("heroImagePreview").src = d.imageUrl;
                byId("heroImagePreview").classList.remove("hidden");
            }
        });

        listenContent("stats", (d) => {
            for (let i = 1; i <= 4; i++) {
                const v = d[`stat${i}Value`];
                const l = d[`stat${i}Label`];
                if (v) byId(`stat${i}Value`).textContent = v;
                if (l) byId(`stat${i}Label`).textContent = l;
                byId(`stat${i}ValueInput`).value = v || byId(`stat${i}Value`).textContent;
                byId(`stat${i}LabelInput`).value = l || byId(`stat${i}Label`).textContent;
            }
        });

        listenContent("about", (d) => {
            if (d.title) byId("aboutTitle").textContent = d.title;
            if (d.text) byId("aboutText1").innerHTML = d.text;
            if (d.feature1Title) byId("aboutFeature1Title").textContent = d.feature1Title;
            if (d.feature1Desc) byId("aboutFeature1Desc").textContent = d.feature1Desc;
            if (d.feature2Title) byId("aboutFeature2Title").textContent = d.feature2Title;
            if (d.feature2Desc) byId("aboutFeature2Desc").textContent = d.feature2Desc;
            if (d.imageUrl) byId("aboutImage").src = d.imageUrl;

            byId("aboutTitleInput").value = d.title || byId("aboutTitle").textContent;
            byId("aboutTextInput").value = d.text || byId("aboutText1").innerHTML;
            byId("aboutFeature1TitleInput").value = d.feature1Title || byId("aboutFeature1Title").textContent;
            byId("aboutFeature1DescInput").value = d.feature1Desc || byId("aboutFeature1Desc").textContent;
            byId("aboutFeature2TitleInput").value = d.feature2Title || byId("aboutFeature2Title").textContent;
            byId("aboutFeature2DescInput").value = d.feature2Desc || byId("aboutFeature2Desc").textContent;
            if (d.imageUrl) {
                byId("aboutImagePreview").src = d.imageUrl;
                byId("aboutImagePreview").classList.remove("hidden");
            }
        });

        listenContent("contact", (d) => {
            if (d.phone) byId("contactPhone").textContent = d.phone;
            if (d.email) byId("contactEmail").textContent = d.email;
            if (d.address) byId("contactAddress").textContent = d.address;

            byId("contactPhoneInput").value = d.phone || byId("contactPhone").textContent;
            byId("contactEmailInput").value = d.email || byId("contactEmail").textContent;
            byId("contactAddressInput").value = d.address || byId("contactAddress").textContent;
        });

        // ---------- Salvar seções ----------
        async function saveSection(docId, data, feedbackId) {
            const fb = byId(feedbackId);
            fb.textContent = "Salvando...";
            fb.className = "text-sm text-slate-500";
            try {
                console.log(`Salvando no Firestore: ${docId}`, data);
                await db.collection("siteContent").doc(docId).set(data, { merge: true });
                console.log(`Salvo com sucesso: ${docId}`);
                fb.textContent = "✓ Salvo com sucesso!";
                fb.className = "text-sm text-emerald-600";
                setTimeout(() => { fb.textContent = ""; }, 3000);
            } catch (e) {
                console.error("Erro ao salvar no Firestore:", e);
                fb.textContent = `Erro: ${e.message}`;
                fb.className = "text-sm text-red-600";
            }
        }

        byId("heroForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fb = byId("heroFeedback");
            const file = byId("heroImageFile").files[0];
            let imageUrl = byId("heroImagePreview").src || "";
            
            if (file) {
                fb.textContent = "Fazendo upload da imagem...";
                fb.className = "text-sm text-slate-500";
                try {
                    imageUrl = await uploadImage(file, "hero");
                } catch (err) {
                    fb.textContent = `Erro no upload: ${err.message}`;
                    fb.className = "text-sm text-red-600";
                    return;
                }
            }

            await saveSection("hero", {
                badge: byId("heroBadgeInput").value.trim(),
                title: byId("heroTitleInput").value.trim(),
                subtitle: byId("heroSubtitleInput").value.trim(),
                imageUrl: imageUrl
            }, "heroFeedback");
            byId("heroImageFile").value = "";
        });

        byId("statsForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {};
            for (let i = 1; i <= 4; i++) {
                data[`stat${i}Value`] = byId(`stat${i}ValueInput`).value.trim();
                data[`stat${i}Label`] = byId(`stat${i}LabelInput`).value.trim();
            }
            await saveSection("stats", data, "statsFeedback");
        });

        byId("aboutForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fb = byId("aboutFeedback");
            const file = byId("aboutImageFile").files[0];
            let imageUrl = byId("aboutImagePreview").src || "";

            if (file) {
                fb.textContent = "Fazendo upload da imagem...";
                fb.className = "text-sm text-slate-500";
                try {
                    imageUrl = await uploadImage(file, "about");
                } catch (err) {
                    fb.textContent = `Erro no upload: ${err.message}`;
                    fb.className = "text-sm text-red-600";
                    return;
                }
            }

            await saveSection("about", {
                title: byId("aboutTitleInput").value.trim(),
                text: byId("aboutTextInput").value.trim(),
                feature1Title: byId("aboutFeature1TitleInput").value.trim(),
                feature1Desc: byId("aboutFeature1DescInput").value.trim(),
                feature2Title: byId("aboutFeature2TitleInput").value.trim(),
                feature2Desc: byId("aboutFeature2DescInput").value.trim(),
                imageUrl: imageUrl
            }, "aboutFeedback");
            byId("aboutImageFile").value = "";
        });

        byId("contactInfoForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            await saveSection("contact", {
                phone: byId("contactPhoneInput").value.trim(),
                email: byId("contactEmailInput").value.trim(),
                address: byId("contactAddressInput").value.trim()
            }, "contactInfoFeedback");
        });

        // ---------- Produtos ----------
        let allProducts = [];

        db.collection("products").orderBy("createdAt", "desc").onSnapshot((snap) => {
            allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderCatalog(allProducts);
        }, (error) => {
            console.error("Erro ao ouvir produtos:", error);
        });

        function renderCatalog(products) {
            const c = byId("catalogContainer");
            if (!products.length) {
                c.innerHTML = '<p class="col-span-full text-center text-slate-500">Nenhum produto cadastrado ainda.</p>';
                return;
            }
            c.innerHTML = products.map(p => {
                const name = esc(p.name || "Produto");
                const cat = esc(p.category || "Instrumentos");
                const desc = esc(p.description || "");
                const img = p.imageUrl
                    ? `<img src="${esc(p.imageUrl)}" alt="${name}" loading="lazy" class="w-full h-56 object-contain bg-slate-100">`
                    : '<div class="w-full h-56 bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-plane text-4xl"></i></div>';
                return `<article data-category="${cat}" class="product-card bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                    ${img}<div class="p-6"><span class="text-xs font-bold uppercase tracking-wide text-sky-700">${cat}</span>
                    <h3 class="text-xl font-bold text-slate-900 mt-2">${name}</h3>
                    <p class="text-slate-600 mt-3 whitespace-pre-line">${desc}</p>
                    <a href="#contact" class="inline-flex mt-5 rounded-lg bg-aero-primary hover:bg-aero-dark text-white font-semibold px-4 py-2">Solicitar cotação</a></div></article>`;
            }).join("");
        }

        window.filterCatalog = (cat) => {
            const filtered = cat === "all" ? allProducts : allProducts.filter(p => p.category === cat);
            renderCatalog(filtered);
            document.querySelectorAll(".cat-btn").forEach(b => {
                const active = (cat === "all" && b.textContent.trim() === "Todos") ||
                    b.getAttribute("onclick")?.includes(`'${cat}'`);
                b.classList.toggle("bg-aero-primary", active);
                b.classList.toggle("text-white", active);
                b.classList.toggle("bg-slate-100", !active);
                b.classList.toggle("text-slate-700", !active);
            });
        };

        async function loadAdminProducts() {
            const list = byId("adminProductsList");
            list.innerHTML = '<p class="text-slate-500">Carregando...</p>';
            try {
                const snap = await db.collection("products").orderBy("createdAt", "desc").get();
                const products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!products.length) {
                    list.innerHTML = '<p class="text-slate-500">Nenhum produto cadastrado.</p>';
                    return;
                }
                list.innerHTML = products.map(p => `<div class="border rounded-lg p-3 flex items-center justify-between gap-3">
                    <div class="min-w-0"><p class="font-semibold break-words">${esc(p.name)}</p><p class="text-slate-500">${esc(p.category || "")}</p></div>
                    <div class="flex shrink-0 gap-3">
                        <button type="button" data-edit="${esc(p.id)}" class="text-blue-700 underline">Editar</button>
                        <button type="button" data-delete="${esc(p.id)}" class="text-red-700 underline">Excluir</button>
                    </div></div>`).join("");
                list.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => editProduct(b.dataset.edit)));
                list.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => deleteProduct(b.dataset.delete)));
            } catch (e) {
                console.error(e);
                list.innerHTML = '<p class="text-red-600">Falha ao carregar. Verifique as regras do Firestore.</p>';
            }
        }

        async function editProduct(id) {
            try {
                const doc = await db.collection("products").doc(id).get();
                if (!doc.exists) return;
                const p = doc.data();
                byId("productId").value = id;
                byId("productName").value = p.name || "";
                byId("productCategory").value = p.category || "Instrumentos";
                byId("productDescription").value = p.description || "";
                byId("productFeedback").textContent = "Editando produto.";
                if (p.imageUrl) {
                    byId("productImagePreview").src = p.imageUrl;
                    byId("productImagePreview").classList.remove("hidden");
                } else {
                    byId("productImagePreview").classList.add("hidden");
                }
                byId("productForm").scrollIntoView({ behavior: "smooth", block: "start" });
            } catch (e) { console.error(e); }
        }

        async function deleteProduct(id) {
            if (!confirm("Excluir este produto?")) return;
            try {
                await db.collection("products").doc(id).delete();
                await loadAdminProducts();
            } catch (e) {
                console.error(e);
                alert("Não foi possível excluir.");
            }
        }

        window.resetProductForm = () => {
            byId("productForm").reset();
            byId("productId").value = "";
            byId("productFeedback").textContent = "";
            byId("productImagePreview").classList.add("hidden");
            byId("productImagePreview").src = "";
        };

        byId("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fb = byId("productFeedback");
            const name = byId("productName").value.trim();
            const file = byId("productImageFile").files[0];
            let imageUrl = byId("productImagePreview").src || "";

            if (file) {
                fb.textContent = "Fazendo upload da imagem...";
                fb.className = "text-sm text-slate-500";
                try {
                    imageUrl = await uploadImage(file, "products");
                } catch (err) {
                    fb.textContent = `Erro no upload: ${err.message}`;
                    fb.className = "text-sm text-red-600";
                    return;
                }
            }

            const payload = {
                name,
                category: byId("productCategory").value,
                description: byId("productDescription").value.trim(),
                imageUrl,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                const id = byId("productId").value;
                if (id) {
                    await db.collection("products").doc(id).update(payload);
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("products").add(payload);
                }
                fb.textContent = "✓ Salvo!";
                fb.className = "text-sm text-emerald-600";
                resetProductForm();
                await loadAdminProducts();
            } catch (e) {
                console.error(e);
                fb.textContent = `Erro ao salvar: ${e.message}`;
                fb.className = "text-sm text-red-600";
            }
        });

        // ---------- Inquiries ----------
        async function loadInquiries() {
            const list = byId("inquiriesList");
            list.innerHTML = '<p class="text-slate-500">Carregando...</p>';
            try {
                const snap = await db.collection("inquiries").orderBy("createdAt", "desc").limit(100).get();
                if (snap.empty) {
                    list.innerHTML = '<p class="text-slate-500">Nenhuma mensagem recebida ainda.</p>';
                    return;
                }
                list.innerHTML = snap.docs.map(d => {
                    const m = d.data();
                    const date = m.createdAt?.toDate?.().toLocaleString("pt-BR") || "";
                    return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex justify-between items-start gap-3 mb-2">
                            <div>
                                <p class="font-bold text-slate-900">${esc(m.name || "—")}</p>
                                <p class="text-sm text-slate-500">${esc(m.email || "")}${m.phone ? " · " + esc(m.phone) : ""}</p>
                            </div>
                            <span class="text-xs text-slate-400 whitespace-nowrap">${esc(date)}</span>
                        </div>
                        <p class="text-slate-700 whitespace-pre-line">${esc(m.message || "")}</p>
                        <button onclick="deleteInquiry('${esc(d.id)}')" class="text-xs text-red-600 underline mt-3">Excluir</button>
                    </div>`;
                }).join("");
            } catch (e) {
                console.error(e);
                list.innerHTML = '<p class="text-red-600">Falha ao carregar mensagens.</p>';
            }
        }

        window.deleteInquiry = async (id) => {
            if (!confirm("Excluir esta mensagem?")) return;
            try {
                await db.collection("inquiries").doc(id).delete();
                await loadInquiries();
            } catch (e) { console.error(e); }
        };

        // ---------- Contato público ----------
        byId("contactForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.currentTarget;
            const fb = byId("contactFeedback");
            const data = new FormData(form);
            fb.textContent = "Enviando...";
            try {
                await db.collection("inquiries").add({
                    name: String(data.get("name") || "").trim(),
                    email: String(data.get("email") || "").trim(),
                    phone: String(data.get("phone") || "").trim(),
                    message: String(data.get("message") || "").trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                form.reset();
                fb.textContent = "Mensagem enviada. Obrigado!";
                fb.className = "text-sm text-emerald-400";
            } catch (err) {
                console.error(err);
                fb.textContent = "Não foi possível enviar agora.";
                fb.className = "text-sm text-red-400";
            }
        });

        // ---------- Misc ----------
        byId("mobileMenuBtn")?.addEventListener("click", () => byId("mobileMenu").classList.toggle("hidden"));
        byId("mobileMenu")?.querySelectorAll("a").forEach(a => a.addEventListener("click", () => byId("mobileMenu").classList.add("hidden")));
        byId("footerYear").textContent = new Date().getFullYear();
    })();
    </script>
