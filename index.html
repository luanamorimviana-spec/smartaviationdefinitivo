
<div id="adminModal"
     class="hidden fixed inset-0 z-[9999] bg-black/70 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">

        <div class="bg-slate-900 text-white p-5 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">Área Administrativa</h2>
                <p class="text-sm text-slate-300">Smart Aviation</p>
            </div>

            <button id="adminCloseBtn"
                    type="button"
                    class="text-3xl"
                    aria-label="Fechar">
                &times;
            </button>
        </div>

        <form id="adminLoginForm" class="p-6 space-y-4">

            <div>
                <label for="adminEmail" class="block font-semibold mb-1">
                    E-mail
                </label>
                <input
                    id="adminEmail"
                    type="email"
                    autocomplete="username"
                    required
                    class="w-full border rounded-lg p-3"
                    placeholder="Seu e-mail"
                >
            </div>

            <div>
                <label for="adminPassword" class="block font-semibold mb-1">
                    Senha
                </label>
                <input
                    id="adminPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                    class="w-full border rounded-lg p-3"
                    placeholder="Sua senha"
                >
            </div>

            <button
                id="adminLoginButton"
                type="submit"
                class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold rounded-lg p-3">
                Entrar
            </button>

            <p id="adminLoginFeedback"
               class="text-sm text-red-600"
               role="status"></p>

        </form>

    </div>
</div>
